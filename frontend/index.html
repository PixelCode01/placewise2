<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placewise | Campus Placement Portal</title>
    <meta name="description" content="Official Training & Placement Cell Portal for Students, Recruiters, and Administrators">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        :root {
            --bg-base: #F7F5F0;
            --bg-surface: #FFFFFF;
            --text-main: #2C2A28;
            --text-muted: #6B655F;
            --accent-forest: #2A4737;
            --accent-forest-hover: #1E3327;
            --accent-forest-light: #F0F7F4;
            --accent-clay: #C26D5C;
            --accent-clay-hover: #A85A4A;
            --accent-clay-light: #FDF8F3;
            --border-color: #E8E4DD;
            --border-light: #F0EDE6;
            --shadow-sm: 0 2px 8px rgba(44, 42, 40, 0.04);
            --shadow-md: 0 8px 24px rgba(44, 42, 40, 0.07);
            --radius: 6px;
            --transition: all 0.2s ease-in-out;
            --font-heading: 'Lora', Georgia, serif;
            --font-body: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--bg-base);
            color: var(--text-main);
            font-size: 0.95rem;
            line-height: 1.6;
            min-height: 100vh;
        }

        h1, h2, h3, h4, h5, h6, .h1, .h2, .h3, .h4, .h5, .h6 {
            font-family: var(--font-heading);
            color: var(--text-main);
            font-weight: 500;
        }

        /* Navbar */
        .navbar-custom {
            background-color: var(--bg-surface);
            border-bottom: 1px solid var(--border-color);
            padding: 0.85rem 0;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar-custom .navbar-brand {
            font-family: var(--font-heading);
            font-size: 1.35rem;
            font-weight: 600;
            color: var(--text-main);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            letter-spacing: -0.2px;
        }

        .brand-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--accent-clay);
            display: inline-block;
        }

        .brand-sub {
            font-family: var(--font-body);
            font-size: 0.72rem;
            font-weight: 400;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            text-transform: uppercase;
            display: block;
            margin-top: -3px;
        }

        .navbar-custom .nav-link {
            color: var(--text-muted);
            font-size: 0.92rem;
            font-weight: 400;
            padding: 0.45rem 0.9rem;
            text-decoration: none;
            border-radius: var(--radius);
            transition: var(--transition);
        }

        .navbar-custom .nav-link:hover {
            color: var(--accent-forest);
            background-color: var(--bg-base);
        }

        .navbar-custom .nav-link.router-link-active {
            color: var(--accent-forest);
            font-weight: 600;
            background-color: var(--accent-forest-light);
        }

        /* Buttons */
        .btn {
            font-family: var(--font-body);
            font-weight: 500;
            border-radius: var(--radius);
            padding: 0.55rem 1.25rem;
            transition: var(--transition);
            letter-spacing: 0.3px;
            box-shadow: none !important;
        }

        .btn-primary {
            background-color: var(--accent-forest);
            border-color: var(--accent-forest);
            color: #fff;
        }

        .btn-primary:hover, .btn-primary:focus, .btn-primary:active {
            background-color: var(--accent-forest-hover) !important;
            border-color: var(--accent-forest-hover) !important;
            color: #fff !important;
        }

        .btn-outline-primary {
            background-color: transparent;
            color: var(--accent-forest);
            border: 1px solid var(--accent-forest);
        }

        .btn-outline-primary:hover, .btn-outline-primary:focus {
            background-color: var(--accent-forest);
            color: #fff;
            border-color: var(--accent-forest);
        }

        .btn-outline-secondary, .btn-secondary {
            border: 1px solid var(--border-color);
            background-color: var(--bg-surface);
            color: var(--text-main);
        }

        .btn-outline-secondary:hover, .btn-secondary:hover {
            background-color: var(--bg-base);
            border-color: #d8d3c9;
            color: var(--text-main);
        }

        .btn-sm {
            padding: 0.35rem 0.85rem;
            font-size: 0.85rem;
        }

        /* Cards */
        .card {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
        }

        .card:hover {
            box-shadow: var(--shadow-md);
        }

        .card-header-clean {
            background-color: var(--bg-base);
            border-bottom: 1px solid var(--border-color);
            padding: 0.9rem 1.25rem;
            font-family: var(--font-heading);
            font-size: 1.05rem;
            font-weight: 500;
            color: var(--text-main);
        }

        /* Stat cards matching SummitDesk */
        .stat-card {
            border-top: 3px solid var(--accent-clay);
            padding: 1.25rem;
            text-align: center;
            background-color: var(--bg-surface);
        }

        .stat-card .stat-num {
            font-family: var(--font-heading);
            font-size: 2.2rem;
            font-weight: 500;
            color: var(--text-main);
            line-height: 1;
            margin-bottom: 0.25rem;
        }

        .stat-card .stat-label {
            font-size: 0.78rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 0.5rem;
            margin-bottom: 0;
            font-weight: 500;
        }

        /* Form Controls */
        .form-control, .form-select {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: var(--radius);
            padding: 0.65rem 0.9rem;
            box-shadow: none;
            font-size: 0.92rem;
            transition: border-color 0.2s;
        }

        .form-control:focus, .form-select:focus {
            background-color: var(--bg-surface);
            border-color: var(--accent-forest);
            box-shadow: 0 0 0 1px var(--accent-forest);
            color: var(--text-main);
        }

        .form-label {
            font-weight: 500;
            color: var(--text-main);
            font-size: 0.88rem;
            margin-bottom: 0.35rem;
        }

        /* Tables */
        .table {
            --bs-table-bg: transparent;
            --bs-table-color: var(--text-main);
            --bs-table-border-color: var(--border-color);
            font-size: 0.92rem;
            margin-bottom: 0;
        }

        .table-responsive {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
        }

        .table thead th {
            background-color: var(--bg-base);
            color: var(--text-muted);
            font-size: 0.76rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--border-color);
            padding: 0.9rem 1rem;
        }

        .table tbody td {
            padding: 0.9rem 1rem;
            vertical-align: middle;
            border-bottom: 1px solid var(--border-color);
        }

        /* Status Badges */
        .status-badge {
            display: inline-block;
            font-size: 0.74rem;
            font-weight: 500;
            letter-spacing: 0.3px;
            padding: 0.3em 0.75em;
            border-radius: 4px;
            line-height: 1.4;
            text-transform: uppercase;
        }

        .status-approved, .status-placed, .status-active, .status-offer {
            background-color: var(--accent-forest-light);
            border: 1px solid #D3EADD;
            color: var(--accent-forest);
        }

        .status-pending, .status-interview {
            background-color: var(--accent-clay-light);
            border: 1px solid #F5E6D8;
            color: #9C5D3D;
        }

        .status-rejected, .status-blacklisted {
            background-color: #FDF3F2;
            border: 1px solid #F5D8D6;
            color: #BA3B33;
        }

        .status-applied, .status-shortlisted, .status-closed, .status-default {
            background-color: #F5F3EF;
            border: 1px solid var(--border-color);
            color: var(--text-main);
        }

        /* Hero Section */
        .hero-section {
            position: relative;
            border-radius: var(--radius);
            overflow: hidden;
            margin-bottom: 2.5rem;
            background-color: var(--accent-forest);
            min-height: 420px;
        }

        .hero-img {
            width: 100%;
            height: 100%;
            min-height: 420px;
            object-fit: cover;
            display: block;
            opacity: 0.75;
        }

        .hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to right, rgba(42, 71, 55, 0.94) 0%, rgba(42, 71, 55, 0.65) 55%, rgba(42, 71, 55, 0.25) 100%);
            display: flex;
            align-items: center;
        }

        .hero-text {
            padding: 3.5rem 3rem;
            max-width: 650px;
        }

        .hero-sub {
            font-family: var(--font-body);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #F0F7F4;
            font-weight: 500;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .hero-sub::before {
            content: '';
            display: inline-block;
            width: 32px;
            height: 1px;
            background-color: #F0F7F4;
        }

        .hero-title {
            font-size: 2.8rem;
            font-weight: 400;
            line-height: 1.18;
            margin-bottom: 1.5rem;
            color: #ffffff;
        }

        .hero-cta {
            background-color: #ffffff;
            color: var(--accent-forest);
            border: none;
            font-weight: 500;
            padding: 0.75rem 1.8rem;
        }

        .hero-cta:hover {
            background-color: var(--bg-base);
            color: var(--accent-forest-hover);
        }

        /* Empty state */
        .empty-state {
            background-color: transparent;
            border: 1px dashed var(--border-color);
            border-radius: var(--radius);
            padding: 3.5rem 1.5rem;
            text-align: center;
        }

        /* Filter chip */
        .filter-chip {
            padding: 0.35rem 0.85rem;
            font-size: 0.84rem;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            background: var(--bg-surface);
            color: var(--text-muted);
            cursor: pointer;
            transition: var(--transition);
            user-select: none;
        }

        .filter-chip:hover {
            border-color: var(--accent-forest);
            color: var(--accent-forest);
        }

        .filter-chip.active {
            background: var(--accent-forest);
            border-color: var(--accent-forest);
            color: #fff;
            font-weight: 500;
        }

        /* Footer */
        .portal-footer {
            background-color: var(--bg-surface);
            border-top: 1px solid var(--border-color);
            padding: 1.5rem 0;
            margin-top: auto;
            color: var(--text-muted);
            font-size: 0.85rem;
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

    <div id="app" class="d-flex flex-column flex-grow-1">
        <!-- Top Navbar -->
        <nav class="navbar-custom" v-if="isLoggedIn">
            <div class="container d-flex align-items-center justify-content-between">
                <div class="d-flex align-items-center gap-4">
                    <router-link :to="'/' + userRole + '/dashboard'" class="navbar-brand">
                        <div>
                            <div class="d-flex align-items-center gap-2">
                                <span>Placewise</span>
                                <span class="brand-dot"></span>
                            </div>
                            <span class="brand-sub">Placement Cell</span>
                        </div>
                    </router-link>
                    
                    <div class="d-flex align-items-center gap-1">
                        <!-- Admin Navigation -->
                        <template v-if="userRole === 'admin'">
                            <router-link to="/admin/dashboard" class="nav-link">Dashboard</router-link>
                            <router-link to="/admin/companies" class="nav-link">Companies</router-link>
                            <router-link to="/admin/students" class="nav-link">Students</router-link>
                            <router-link to="/admin/drives" class="nav-link">Drives</router-link>
                            <router-link to="/admin/placements" class="nav-link">Placements</router-link>
                        </template>

                        <!-- Student Navigation -->
                        <template v-if="userRole === 'student'">
                            <router-link to="/student/dashboard" class="nav-link">Dashboard</router-link>
                            <router-link to="/student/drives" class="nav-link">Browse Drives</router-link>
                            <router-link to="/student/applications" class="nav-link">My Applications</router-link>
                            <router-link to="/student/profile" class="nav-link">Profile</router-link>
                        </template>

                        <!-- Company Navigation -->
                        <template v-if="userRole === 'company'">
                            <router-link to="/company/dashboard" class="nav-link">Dashboard</router-link>
                            <router-link to="/company/profile" class="nav-link">Profile</router-link>
                            <router-link to="/company/drives/create" class="nav-link">Post Drive</router-link>
                        </template>
                    </div>
                </div>

                <div class="d-flex align-items-center gap-3">
                    <span class="status-badge status-approved">
                        {{ userRole }}
                    </span>
                    <button class="btn btn-outline-secondary btn-sm" @click="logout">Sign Out</button>
                </div>
            </div>
        </nav>

        <router-view></router-view>

        <!-- Footer -->
        <footer class="portal-footer" v-if="!isLoggedIn">
            <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center gap-2">
                <div>
                    <strong class="text-dark">Placewise</strong> &mdash; Campus Placement & Internship Management System
                </div>
                <div class="small">
                    Academic Year 2025&ndash;2026 &middot; Training & Placement Cell
                </div>
            </div>
        </footer>
    </div>

    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/vue-router@4/dist/vue-router.global.js"></script>

    <!-- Components with cache busting -->
    <script src="components/Landing.js?v=9"></script>
    <script src="components/auth/Login.js?v=9"></script>
    <script src="components/auth/Register.js?v=9"></script>
    <script src="components/admin/AdminDashboard.js?v=9"></script>
    <script src="components/admin/ManageCompanies.js?v=9"></script>
    <script src="components/admin/ManageStudents.js?v=9"></script>
    <script src="components/admin/ManageDrives.js?v=9"></script>
    <script src="components/admin/ManagePlacements.js?v=9"></script>
    <script src="components/company/CompanyDashboard.js?v=9"></script>
    <script src="components/company/EditCompanyProfile.js?v=9"></script>
    <script src="components/company/CreateDrive.js?v=9"></script>
    <script src="components/company/ViewApplications.js?v=9"></script>
    <script src="components/student/StudentDashboard.js?v=9"></script>
    <script src="components/student/BrowseDrives.js?v=9"></script>
    <script src="components/student/MyApplications.js?v=9"></script>
    <script src="components/student/EditProfile.js?v=9"></script>

    <script src="app.js?v=9"></script>
</body>
</html>
